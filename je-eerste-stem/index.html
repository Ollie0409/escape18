<script>window.E18_BUILD={"version":"je-eerste-stem-20261111-9be7c08"};
window.E18_LESSON={"slug":"je-eerste-stem","title":"Je eerste stem","lead":"Hoe werkt stemmen? Leer wie mag stemmen, wat je meeneemt en hoe je het biljet invult.","fictional":"Lina, Milan, Sanne, Joris, Ans en de documenten zijn verzonnen. Niemand in deze les is door een rechter uitgesloten van het kiesrecht. De regels en de data zijn echt. De les zegt niet op wie je stemt en ook niet of je gaat stemmen.","minutes":26,"variant":"basis","checked":"2026-11-08","validUntil":"2027-03-31","staleText":"Let op: sommige data kunnen verouderd zijn.","wishes":["zorgverzekering","belasting","studiefinanciering","wonen","werk","budget"],"check":{"A":[{"id":"C1","prompt":"Je bent Nederlander. Op 1 februari 2027 sta je ingeschreven in je provincie. Je wordt 18 op 16 maart 2027. Mag je op 17 maart stemmen voor de Provinciale Staten (het parlement van je provincie)?","options":[["a","Nee, je moet op 1 februari al 18 zijn"],["b","Ja, op 17 maart ben je al 18"],["c","Ja, maar alleen voor het waterschap"]],"correct":"b"},{"id":"C2","prompt":"Op je paspoort staat 'geldig tot 1 februari 2022'. Mag je ermee stemmen op 17 maart 2027?","options":[["a","Nee, een verlopen paspoort telt nooit"],["b","Nee, het is te lang geleden verlopen"],["c","Ja, als je ook je stempas meeneemt"]],"correct":"b"},{"id":"C3","prompt":"Je buurman stemt voor de Provinciale Staten al voor 1 ander. Jullie wonen in dezelfde gemeente. Mag hij daar ook voor jou stemmen?","options":[["a","Ja, dat past nog binnen het maximum"],["b","Nee, hij mag maar voor 1 ander stemmen"],["c","Ja, voor zoveel mensen als hij wil"]],"correct":"a"},{"id":"C4","prompt":"Je maakt op het gewone stembiljet twee vakjes rood. Wat gebeurt er met je stem?","options":[["a","De eerste keuze telt"],["b","De stem is ongeldig"],["c","De stem telt als blanco"]],"correct":"b"}],"B":[{"id":"B1","prompt":"Je bent Nederlander. Op 1 februari 2027 sta je ingeschreven in je provincie. Je wordt 18 op 18 maart 2027. Mag je op 17 maart stemmen voor de Provinciale Staten (het parlement van je provincie)?","options":[["a","Nee, op 17 maart ben je nog 17"],["b","Ja, je bent dan bijna 18"],["c","Nee, je moet al 18 zijn op 1 februari"]],"correct":"a"},{"id":"B2","prompt":"Op je identiteitskaart staat 'geldig tot 10 januari 2024'. Mag je ermee stemmen op 17 maart 2027?","options":[["a","Nee, een verlopen kaart telt nooit"],["b","Ja, hij is niet te lang verlopen"],["c","Ja, maar alleen samen met je paspoort"]],"correct":"b"},{"id":"B3","prompt":"Je buurvrouw stemt voor de Provinciale Staten al voor 2 anderen. Jullie wonen in dezelfde gemeente. Mag ze daar ook voor jou stemmen?","options":[["a","Ja, als jij de stempas tekent"],["b","Nee, dan is het maximum bereikt"],["c","Nee, alleen familie mag voor je stemmen"]],"correct":"b"},{"id":"B4","prompt":"Je laat het gewone stembiljet leeg. Wat gebeurt er met je stem?","options":[["a","De stem telt als blanco"],["b","De stem is ongeldig"],["c","Je krijgt een nieuw biljet"]],"correct":"a"}]},"rooms":[{"id":"mag","title":"Mag ik al stemmen?","where":"maandag 1 februari 2027","intro":"Het is maandag 1 februari 2027. Lina is 17. Ze leest de klassenapp over de verkiezingen.","docs":{"klas":{"type":"chat","kind":"Klassenapp (verzonnen)","name":"Klas (verzonnen)","sub":"groepsapp","selfName":"Lina","messages":[["m1","them","Milan: Mogen wij op 17 maart al stemmen?","16:02"],["m2","me","Lina: Ik word 18 op 17 maart!","16:03"],["m3","them","Milan: Ik word pas 18 op 20 maart.","16:04"],["m4","them","Sanne: Ik ben 19. Ik heb de Belgische nationaliteit en geen andere.","16:05"]],"plain":"Nationaliteit: van welk land je burger bent. EU-burger: iemand uit een land van de Europese Unie, zoals België."},"brief":{"type":"letter","kind":"Brief (verzonnen)","from":"De gemeente (verzonnen voorbeeld)","place":"maandag 1 februari 2027","greeting":"Beste inwoner,","lines":[["g1","U krijgt een stempas voor elke verkiezing waarvoor u mag stemmen."],["g2","De stempassen komen uiterlijk 14 dagen voor 17 maart."]],"sign":"De gemeente","plain":"Provinciale Staten: het parlement van de provincie. Waterschap: het bestuur voor dijken en water. Stempas: je uitnodiging om te stemmen. Uiterlijk: niet later dan."}},"rules":{"title":"Regels","lines":[["r1","Je moet op de dag van de stemming 18 of ouder zijn."],["r2","Je moet op 1 februari bij de gemeente ingeschreven staan in het juiste gebied. Een rechter mag je stemrecht niet hebben afgenomen."],["r3","Voor de Provinciale Staten moet je ook Nederlander zijn."],["r4","Voor het waterschap mag ook een EU-burger stemmen, of iemand met een geldige verblijfsvergunning."],["r5","Stemmen is niet verplicht. Je beslist zelf of je gaat."]]},"questions":[{"id":"lina","short":"Wie mag stemmen","type":"single","docs":["klas"],"situ":"Lina en Milan zijn Nederlanders. Op 1 februari staan ze ingeschreven in de provincie.","prompt":"Wie van hen mag op 17 maart stemmen?","options":[["a","Alleen Milan"],["d","Alleen Lina"],["b","Lina en Milan"],["c","Niemand: ze zijn te jong"]],"correct":"d","pointTo":{"rule":"r1"},"retry":"Lees regel 1. Hoe oud is ieder op 17 maart?","hint":"Kijk naar de verjaardagen in de app.","explain":"Lina is op 17 maart precies 18. Milan is dan nog 17.","sources":["ksStemmen","roWie","kwB"]},{"id":"sanne","short":"Welke verkiezing","type":"single","docs":["klas"],"situ":"Sanne staat op 1 februari ingeschreven in de provincie en het waterschap.","prompt":"Voor welke verkiezing mag Sanne stemmen?","options":[["b","Voor de Provinciale Staten en het waterschap"],["c","Nergens, want ze is geen Nederlander"],["a","Alleen voor de Provinciale Staten"],["d","Alleen voor het waterschap"]],"correct":"d","pointTo":{"rules":["r3","r4"]},"retry":"Lees regel 3 en 4.","hint":"Lees wat EU-burger betekent.","explain":"Voor de Provinciale Staten moet je Nederlander zijn. Voor het waterschap mag een EU-burger ook stemmen.","sources":["roWie","kwB","gmRdam"]},{"id":"thuis","short":"Stempassen thuis","type":"single","docs":["brief"],"prompt":"Wanneer heeft Lina haar stempassen uiterlijk thuis?","options":[["d","Woensdag 3 maart"],["a","Maandag 1 februari"],["c","Woensdag 10 maart"],["b","Woensdag 17 maart"]],"correct":"d","pointTo":{"doc":"brief","line":"g2"},"retry":"Lees de laatste zin van de brief.","hint":"Tel 14 dagen terug vanaf 17 maart.","explain":"14 dagen voor woensdag 17 maart is woensdag 3 maart.","sources":["kwJ","roNodig","ksKal"]}],"digit":"2","minutes":6,"clue":"Het 1e cijfer: vier Nederlanders staan ingeschreven in de provincie. Ze zijn geboren op 2, 17 en 18 maart 2009 en in 2010. Hoeveel mogen op 17 maart 2027 stemmen?","clueFull":true,"clueDocs":["rules"],"clueRetry":"Lees regel 1. Wie is op 17 maart 2027 al 18?","clueWrong":{"3":"Wie op 18 maart is geboren, is op 17 maart nog 17."},"remember":"Je leeftijd op de dag van de stemming telt. Nog geen 18? Dan mag je de volgende keer.","teacherNote":"Vraag niet wie mag stemmen of wie gaat stemmen. Dit heet actief kiesrecht: het recht om te kiezen (Grondwet artikel 4). Goed antwoord op de gespreksvraag: zo is voor iedereen duidelijk wie mag stemmen. Extra: voor het waterschap hoef je geen Nederlander te zijn. De stempas komt naar het adres waar je op 1 februari staat ingeschreven.","teacherDetail":"Kiesrecht Provinciale Staten: Nederlander, op de dag van de stemming 18 jaar of ouder, op de dag van de kandidaatstelling ingezetene van de provincie, niet uitgesloten van het kiesrecht (Kieswet art. B 2; Kiesraad, Stemmen). Kiesrecht waterschap: op de dag van de kandidaatstelling ingezetene van het waterschap en op de dag van de stemming 18; geen Nederlander nodig, maar wie geen EU-burger is, moet rechtmatig in Nederland verblijven (Kieswet art. B 2a en B 3 lid 2 onder a). De Rijksoverheid zegt: Nederlandse of EU-nationaliteit, of een geldige verblijfsvergunning, en geboren vóór 18 maart 2009 (Rijksoverheid, Wie mag stemmen bij de verkiezingen voor de Provinciale Staten en de waterschappen?). Dag van de kandidaatstelling: maandag 1 februari 2027; wie dan in de provincie staat ingeschreven, krijgt daar de stempas (Kiesraad, Verkiezingskalender). De gemeente registreert kiezers vanzelf via de BRP (Kiesraad, Kiesgerechtigdheid). Stempas: ten minste 14 dagen voor de stemming, dus uiterlijk woensdag 3 maart 2027; wie voor beide verkiezingen mag stemmen, krijgt twee stempassen, één per verkiezing; wie alleen voor het waterschap mag stemmen, krijgt er één (Kieswet art. J 7; Rijksoverheid, Wat heb ik nodig om te stemmen). Stemmen is niet verplicht (Rijksoverheid, Wie mag stemmen). Op 17 maart 2027 zijn er ook verkiezingen voor de kiescolleges en de eilandsraden (ProDemos, Overzicht van verkiezingen); die zitten niet in de les.","discuss":["Waarom telt je leeftijd op de dag van de stemming? Extra voor snelle tweetallen: welk verschil zie je tussen de Provinciale Staten en het waterschap?"]},{"id":"pas","title":"Stempas en ID","where":"donderdag 4 maart 2027","intro":"Het is donderdag 4 maart 2027. Lina heeft haar twee stempassen. Ze zoekt haar identiteitskaart.","docs":{"stempas":{"type":"table","title":"Stempas Provinciale Staten (stukje)","from":"Gemeente (verzonnen voorbeeld)","rows":[["s1","Open","Meestal van 7.30 tot 21.00 uur"]],"plain":"Stembureau: de plek waar je stemt. Balie: het loket van de gemeente."},"id":{"type":"table","title":"Identiteitskaart van Lina (stukje)","from":"Verzonnen voorbeeld","rows":[["k1","Naam","Lina"],["k2","Geldig tot","9 juli 2024"]],"plain":"Verlopen: niet meer geldig."}},"rules":{"title":"Regels","lines":[["r1","Neem je stempas en je paspoort, identiteitskaart of rijbewijs mee."],["r2","Je identiteitsbewijs mag op de dag van de stemming maximaal 5 jaar verlopen zijn."],["r3","Stempas kwijt? Vraag een nieuwe aan met een formulier, uiterlijk vrijdag 12 maart."],["r4","Aan de balie vraag je een nieuwe stempas tot dinsdag 16 maart, 12.00 uur."],["r5","Met je stempas voor de Provinciale Staten kies je zelf een stembureau. Het moet in je gemeente liggen."],["r6","Voor het waterschap kan het anders zijn. Kijk op je stempas waar je mag stemmen."]]},"questions":[{"id":"idkaart","short":"Verlopen ID","type":"single","docs":["id"],"prompt":"Mag Lina op 17 maart stemmen met deze identiteitskaart?","options":[["b","Nee, ze heeft een paspoort nodig"],["a","Nee, de kaart is verlopen"],["d","Ja, hij is minder dan 5 jaar verlopen"],["c","Ja, maar alleen samen met haar rijbewijs erbij"]],"correct":"d","pointTo":{"rule":"r2"},"retry":"Lees regel 2. Hoe lang is de kaart al verlopen?","hint":"Tel de jaren van juli 2024 tot maart 2027.","explain":"De kaart verliep in juli 2024. Dat is minder dan 5 jaar geleden, dus het mag.","sources":["ksId","roNodig"]},{"id":"kwijt","short":"Stempas kwijt","type":"single","docs":[],"situ":"Het is zaterdag 13 maart. Lina is haar stempas kwijt.","prompt":"Wat kan ze nu nog doen?","options":[["d","Ze gaat tot dinsdag 12.00 uur naar de balie"],["c","Ze kan niets meer doen"],["a","Ze stuurt nu een formulier op"],["b","Ze stemt op 17 maart met alleen haar ID-kaart"]],"correct":"d","pointTo":{"rules":["r3","r4"]},"retry":"Lees regel 3 en 4. Welke datum is al voorbij?","hint":"Zet 12, 13 en 16 maart op een rij.","explain":"Het formulier moest op 12 maart binnen zijn. De balie kan nog tot dinsdag 12.00 uur.","sources":["kwJ","roKwijt","ksKal"]},{"id":"waar","short":"Waar stemmen","type":"single","docs":["stempas"],"prompt":"Waar kan Lina met deze stempas stemmen?","options":[["b","In elk stembureau in Nederland"],["a","Alleen bij het stembureau naast haar huis"],["c","In elk stembureau in haar provincie"],["d","In elk stembureau in haar gemeente"]],"correct":"d","pointTo":{"rule":"r5"},"retry":"Lees regel 5.","hint":"Wie kiest het stembureau?","explain":"Lina kiest zelf een stembureau in haar gemeente. Elders heb je een kiezerspas nodig.","sources":["ksStempas","kwJ"]}],"digit":"3","minutes":6,"clue":"Het 2e cijfer: vier ID-kaarten zijn geldig tot 1 mei. De jaren zijn 2021, 2023, 2026 en 2029. Met hoeveel mag je op 17 maart 2027 stemmen?","clueFull":true,"clueDocs":["rules"],"clueRetry":"Lees regel 2. Tel per kaart de jaren.","remember":"Neem je stempas en je ID mee. Je ID mag maximaal 5 jaar verlopen zijn.","teacherNote":"Leerlingen mogen de kalender op hun telefoon gebruiken. Goed antwoord op de gespreksvraag: zo weet het stembureau dat jij het bent. Extra: met een verklaring van vermissing en een pasje met je foto kun je toch stemmen.","teacherDetail":"Identiteitsbewijs: paspoort, identiteitskaart of rijbewijs uit Nederland; ook bepaalde documenten uit de EU, de EER en Zwitserland. Het mag op de verkiezingsdag maximaal 5 jaar verlopen zijn: geldig tot 18 maart 2022 of later (Kiesraad, Identificatie; Rijksoverheid, Wat heb ik nodig om te stemmen). Die regel staat in een tijdelijke ministeriële regeling die tot 1 januari 2028 geldt (Regeling aanwijzing documenten vaststellen identiteit Kieswet 2024 art. 1 lid 2, Staatscourant 2025, 32179). Kwijt of gestolen: een schriftelijke bevestiging van de vermissing met een document op je naam met foto (Kieswet art. J 24 lid 2). Nieuwe stempas: schriftelijk, ontvangen op de vijfde dag voor de stemming (vrijdag 12 maart 2027), of mondeling tot de dag voor de stemming 12.00 uur (dinsdag 16 maart 2027), met een kopie van je ID (Kieswet art. J 8; Kiesraad, Verkiezingskalender; Rijksoverheid, Stempas kwijt of niet ontvangen). De oude stempas wordt dan ongeldig (Kieswet art. J 7a). Waar: met de stempas in een stemlokaal naar keuze in de gemeente en in het gebied van de verkiezing (Kieswet art. J 5; Kiesraad, Stempas). Voor het waterschap kan dat in een gemeente met meer waterschappen niet in elk stembureau (Rijksoverheid, Waar kan ik stemmen op 17 maart 2027?); daarom gaat vraag 3 over de stempas voor de Provinciale Staten, en regel 6 zegt dat het voor het waterschap anders kan zijn. Stembureaus: de stemming duurt van 7.30 tot 21.00 uur (Kieswet art. J 1 lid 2); sommige stembureaus hebben andere tijden (Rijksoverheid, Waar kan ik stemmen op 17 maart 2027?).","discuss":["Waarom moet je je ID laten zien in het stembureau? Extra voor snelle tweetallen: wat doe je als je ID gestolen is?"]},{"id":"volmacht","title":"Iemand anders laten stemmen","where":"maandag 8 maart 2027","intro":"Het is maandag 8 maart 2027. Lina is op 17 maart op werkweek. Haar broer Joris (20) studeert elders. Ans en Joris mogen stemmen voor de Provinciale Staten.","docs":{"app":{"type":"chat","kind":"Appgroep (verzonnen)","name":"Lina, Joris en buurvrouw Ans (verzonnen)","sub":"groepsapp","selfName":"Lina","messages":[["f1","me","Lina: Ans, wil jij op 17 maart voor mij stemmen?","19:10"],["f2","them","Ans: Ja hoor. Ik woon ook in jouw gemeente.","19:12"],["f3","them","Joris: Ik sta thuis ingeschreven. Als ik ga stemmen, doe ik dat in mijn studentenstad.","19:15"],["f4","them","Joris: Dat is een andere gemeente in onze provincie.","19:16"]],"plain":"Machtigen: iemand toestemming geven om voor jou te stemmen. Gemachtigde: de kiezer die voor jou stemt. Kopie: een afdruk of duidelijke foto. Kiezerspas: een pas om in een andere gemeente te stemmen."}},"rules":{"title":"Regels","lines":[["r1","Kun je niet zelf stemmen? Machtig dan op de achterkant van je stempas een kiezer uit je gemeente. Jullie tekenen samen."],["r2","De gemachtigde neemt een kopie van jouw ID mee. De gemachtigde stemt tegelijk voor zichzelf en per verkiezing voor maximaal 2 anderen."],["r3","Alleen jij mag iemand vragen om voor je te stemmen. Een ander mag daar niet om vragen."],["r4","Stem je in een andere gemeente in je provincie? Dan heb je een kiezerspas nodig. Een kiezerspas voor het waterschap werkt alleen in dat waterschap."],["r5","Een kiezerspas vraag je aan met dezelfde deadlines als een nieuwe stempas."]]},"questions":[{"id":"ans","short":"Volmacht aan Ans","type":"single","docs":["app"],"prompt":"Mag Ans met Lina's stempas voor Lina stemmen?","options":[["a","Nee, want Ans is geen familie"],["d","Ja, Ans woont in dezelfde gemeente"],["c","Ja, maar dan mag Ans zelf niet stemmen"],["b","Nee, dat kan alleen met een formulier"]],"correct":"d","pointTo":{"rule":"r1"},"retry":"Lees regel 1. Waar woont Ans?","hint":"Kijk in de appgroep.","explain":"Ans woont in Lina's gemeente. Dan kan het via de achterkant van de stempas.","sources":["kwL","roMacht","ksVolmacht"]},{"id":"ronselen","short":"Om een stempas vragen","type":"single","docs":[],"situ":"Een onbekende vraagt Joris: 'Geef mij je stempas, dan stem ik voor je.'","prompt":"Mag die persoon dat vragen?","options":[["b","Ja, als die persoon in zijn gemeente woont"],["a","Ja, als Joris de achterkant tekent"],["d","Nee, alleen Joris mag iemand vragen"],["c","Nee, alleen een stembureaulid mag dat"]],"correct":"d","pointTo":{"rule":"r3"},"retry":"Lees regel 3.","hint":"Wie moet de vraag stellen?","explain":"Alleen de kiezer zelf mag iemand vragen. Om een volmacht vragen heet ronselen en is verboden.","sources":["roMacht","ksVolmacht","kwZ"]},{"id":"kiezerspas","short":"Stemmen in een andere gemeente","type":"single","docs":["app"],"prompt":"Wat heeft Joris nodig om daar te stemmen voor de Provinciale Staten?","options":[["c","Een nieuwe stempas uit zijn studentenstad"],["a","Alleen zijn eigen stempas"],["b","Een volmacht van zijn ouders"],["d","Een kiezerspas van zijn gemeente"]],"correct":"d","pointTo":{"doc":"app","lines":["f3","f4"]},"retry":"Lees wat Joris schrijft. Waar staat hij ingeschreven?","hint":"Lees regel 4.","explain":"Joris stemt buiten de gemeente waar hij staat ingeschreven. Daarvoor heeft hij een kiezerspas nodig.","sources":["ksKiezerspas","roNodig","kwK"]}],"digit":"3","minutes":8,"clue":"Het 3e cijfer: Ans stemt voor de Provinciale Staten, voor zichzelf en met 2 volmachten. Hoeveel stembiljetten krijgt ze voor die verkiezing?","clueFull":true,"clueDocs":["rules"],"clueRetry":"Lees regel 2. Tel haar eigen stem ook mee.","remember":"Kun je zelf niet stemmen? Machtig zelf een kiezer uit je gemeente. Elders stemmen? Vraag een kiezerspas.","teacherNote":"Zeg erbij dat ronselen strafbaar is. Goed antwoord op de gespreksvraag: zo stemt niemand onder druk voor een ander. Extra: Lina kan haar stempas terugvragen zolang Ans nog niet heeft gestemd. Deadlines kiezerspas: met een formulier tot vrijdag 12 maart, aan de balie tot dinsdag 16 maart 12.00 uur.","teacherDetail":"Volmacht: wie verwacht niet zelf te kunnen stemmen, kan een andere kiezer machtigen; de kiezer wijst zelf de gemachtigde aan en zegt op wie of blanco (Kieswet art. L 1 en L 2). Onderhandse volmacht op de stempas: de gemachtigde stemt in de gemeente van de volmachtgever; beiden tekenen; de gemachtigde laat een kopie van het ID van de volmachtgever zien, ook op een telefoon (Kieswet art. L 14 en L 17; Kiesraad, Volmacht; Rijksoverheid, Hoe kan ik iemand anders vragen om voor mij te stemmen?). Tegelijk met de eigen stem, en per verkiezing hoogstens twee volmachten (Kieswet art. L 3 en L 4). Schriftelijke volmacht met een formulier: ontvangen op de vijfde dag voor de stemming, dus vrijdag 12 maart 2027; de gemachtigde moet kiezer zijn in het gebied van de verkiezing; niet in te trekken; een onderhandse volmacht wel, tot er gestemd is (Kieswet art. L 5, L 7 en L 8; Kiesraad, Verkiezingskalender). Ronselen is strafbaar; het initiatief ligt bij de kiezer (Kieswet art. Z 8; omkoping is art. Z 4; Kiesraad, Volmacht). Kiezerspas: stemmen in een stembureau naar keuze binnen het gebied van de verkiezing, voor de Provinciale Staten in de hele provincie; schriftelijk tot vrijdag 12 maart, mondeling tot dinsdag 16 maart 12.00 uur; kwijt is kwijt (Kieswet art. K 1, K 3 en K 4; Kiesraad, Kiezerspas). Voor het waterschap geldt een eigen kiezerspas, alleen binnen het waterschap (Rijksoverheid, Waar kan ik stemmen op 17 maart 2027?). De minister laat het volmachtstelsel onderzoeken; dat verandert nog niets voor maart 2027 (Rijksoverheid, nieuws 2 juli 2026).","discuss":["Waarom mag een ander niet om jouw stempas vragen? Extra voor snelle tweetallen: kan Lina haar volmacht nog intrekken?"]},{"id":"hokje","title":"In het stemhokje","where":"woensdag 17 maart 2027","intro":"Het is woensdag 17 maart 2027. Sanne gaat stemmen voor het waterschap.","docs":{"folder":{"type":"contract","title":"Waarover stem je? (folder, verzonnen)","parties":"Verzonnen voorbeeld","articles":[["p1","Provinciale Staten","Ze beslissen mee over natuur, provinciale wegen en de bus in de regio. Ze kiezen ook de Eerste Kamer."],["p2","Waterschap","Het zorgt voor dijken, genoeg en schoon water en het zuiveren van afvalwater."]],"plain":"Afvalwater: vies water uit huizen en bedrijven. Ongeldig: je stem telt niet mee."},"chat":{"type":"chat","kind":"Chat (verzonnen)","name":"Sanne en Lina (verzonnen)","sub":"chat","selfName":"Lina","messages":[["c1","them","Sanne: Ik deed een stemhulp. Er kwam een partij bovenaan.","08:40"],["c2","me","Lina: Moet je nu op die partij stemmen?","08:41"]],"plain":"Stemhulp: een website met stellingen over politiek. Suggestie: een idee, geen opdracht."}},"rules":{"title":"Regels","lines":[["r1","Maak op het gewone stembiljet één vakje rood. Een rood kruisje in het vakje mag ook."],["r2","Ongeldig: een andere kleur dan rood, meer dan één vakje, of je naam erop."],["r3","Bij het gewone stembiljet mag je één keer een nieuw biljet vragen. Laat je het biljet leeg? Dan stem je blanco."],["r4","Sommige gemeenten testen een nieuw stembiljet. Volg daar de uitleg van de gemeente."],["r5","Een stemhulp vergelijkt jouw antwoorden met partijen. De uitkomst is een suggestie. Jij kiest zelf."],["r6","Uitleg over stemmen: je gemeente, de Kiesraad en ProDemos."]]},"questions":[{"id":"biljet","short":"Geldig biljet","type":"single","docs":[],"situ":"Sanne krijgt het gewone stembiljet en een rood potlood.","prompt":"Welk ingevuld biljet is geldig?","options":[["d","Eén vakje met een rood kruisje"],["b","Eén vakje blauw"],["c","Eén vakje rood en haar naam erop"],["a","Twee vakjes rood"]],"correct":"d","pointTo":{"rules":["r1","r2"]},"retry":"Lees regel 1 en 2.","hint":"Streep eerst de ongeldige biljetten weg.","explain":"Een rood kruisje in één vakje telt. Blauw, twee vakjes of een naam maken de stem ongeldig.","sources":["kwN7","ksVb","roHoe"]},{"id":"dijk","short":"Waarover beslist het waterschap","type":"single","docs":["folder"],"situ":"In het nieuws: 'Nieuwe streekbus naar het ziekenhuis' en 'Dijk langs de rivier wordt hoger'.","prompt":"Over welk bericht beslist het waterschap?","options":[["b","Over de bus en de dijk"],["a","Over de nieuwe streekbus"],["c","Over de hogere dijk"]],"correct":"c","pointTo":{"doc":"folder","lines":["p1","p2"]},"retry":"Lees de folder nog eens.","hint":"Lees wat de folder zegt over water.","explain":"Het waterschap zorgt voor de dijken. Over de streekbus beslist de provincie mee.","sources":["roWs","roPS","ksWs"]},{"id":"stemhulp","short":"Uitkomst stemhulp","type":"single","docs":["chat"],"prompt":"Wat betekent de uitkomst van de stemhulp voor Sanne?","options":[["a","Ze moet nu op die partij stemmen"],["d","Ze kiest zelf: het is een suggestie"],["b","Haar stem is al uitgebracht"],["c","De gemeente krijgt haar antwoorden te zien"]],"correct":"d","pointTo":{"doc":"chat","line":"c1"},"retry":"Lees wat Sanne schreef. Wat zegt regel 5 daarover?","hint":"Wie beslist er in het stemhokje?","explain":"Een stemhulp geeft een suggestie. Sanne kiest zelf, en niemand ziet wat ze stemt.","sources":["pdVerk","roHoe"]}],"digit":"1","minutes":6,"clue":"Het 4e cijfer: Sanne gebruikt het gewone stembiljet. Ze vergist zich twee keer. Hoeveel nieuwe biljetten kan ze krijgen?","clueFull":true,"clueDocs":["rules"],"clueRetry":"Lees regel 3.","clueWrong":{"2":"Bij het gewone biljet krijg je maar één keer een nieuw."},"remember":"Maak op het gewone biljet één vakje rood. Een stemhulp geeft een suggestie. Jij kiest zelf.","teacherNote":"Noem geen partij en geef geen voorbeeld van een uitkomst. Goed antwoord op de gespreksvraag: zo kan niemand je dwingen of zien wat je stemt. Extra: blanco is een lege keuze, ongeldig is fout ingevuld. Let op: rond Amsterdam en Rotterdam-Den Haag regelt een vervoerregio de bus, niet de provincie.","teacherDetail":"Stembiljet: de kiezer maakt een wit stipje vóór de kandidaat van zijn keuze rood (Kieswet art. J 26); in het stemhokje ligt rood schrijfmateriaal (Kiesbesluit art. J 5 lid 2). Blanco: geen vakje rood en niets geschreven; ongeldig: geen ondubbelzinnige keuze door het rood maken van een stipje, of een bijvoeging waardoor de kiezer te herkennen is (Kieswet art. N 7). Alleen rood telt; twee of meer vakjes is ongeldig; een naam op het biljet is in principe ongeldig; een rood kruisje of vinkje in één vakje is geldig (Kiesraad, Voorbeelden blanco, geldige en ongeldige stemmen). Bij het gewone biljet één keer een nieuw biljet bij een vergissing (Kieswet art. J 27); bij de proef met het nieuwe biljet hoogstens twee keer (Tijdelijk experimentenbesluit nieuwe stembiljetten art. 8, Staatsblad 2023, 384). Blanco en ongeldige stemmen tellen mee voor de opkomst, niet voor de zetels (Kiesraad, Blanco/ongeldig). Nieuw stembiljet: dezelfde 11 gemeenten als in 2026 zijn uitgenodigd om op 17 maart 2027 met het nieuwe, kleinere biljet te stemmen; daar kleur je een partij en een kandidaatnummer (Rijksoverheid, nieuws 2 november 2026; Rijksoverheid, Ontwikkelen nieuw stembiljet). Provinciale Staten: beslissen mee over ruimte, natuur, streekvervoer en provinciale wegen, en kiezen de Eerste Kamer (Rijksoverheid, Waar stem ik voor bij de Provinciale Statenverkiezingen?; Kiesraad, Provinciale Statenverkiezingen). Waterschap: dijken en sluizen, zuiveren van afvalwater, genoeg en schoon water (Rijksoverheid, Waar stem ik voor bij de waterschapsverkiezingen?; Waterschapswet art. 1). Stemhulp: gebruikers zien met welke partij ze de meeste standpunten gemeen hebben (ProDemos, Verkiezingen). Stemgeheim: je stemt alleen en in het geheim (Rijksoverheid, Stemmen bij verkiezingen: hoe werkt dat?).","discuss":["Waarom stemt iedereen alleen, in een hokje? Extra voor snelle tweetallen: wat is het verschil tussen blanco en ongeldig?"]}],"debrief":["Welke regel verbaasde je het meest? Waarom?","Waarom stemt iedereen in Nederland alleen, in een hokje?","Waar vind je uitleg als je twijfelt over een regel?"],"plan":{"intro":"Kies één ding. Zet er een moment bij.","when":["ik 18 word","mijn stempas thuiskomt","ik op de dag zelf weg ben"],"then":["kijk ik tot wanneer mijn ID geldig is","leg ik mijn stempas op een vaste plek","lees ik hoe een volmacht werkt","zoek ik op wanneer de volgende verkiezing is"],"within":["een dag","een week","twee weken"]},"slip":{"title":"Mijn stemcheck","intro":"Dit is van jou. Je hoeft het aan niemand te laten zien.","fields":[{"label":"Ik weet vanaf welke leeftijd je mag stemmen:","hint":"ja / nee / een beetje (omcirkel)","lines":0},{"label":"Mijn identiteitsbewijs is geldig tot:","lines":1},{"label":"Krijg ik een stempas? Dan leg ik hem hier:","lines":1},{"label":"Mag ik nog niet stemmen? Dit wil ik dan weten:","lines":1},{"label":"Eén vraag die ik nog heb over stemmen:","lines":2},{"label":"Hier zoek ik het antwoord:","hint":"gemeente / Kiesraad / ProDemos (omcirkel)","lines":0}],"footer":"Uitleg over stemmen: je gemeente, kiesraad.nl en prodemos.nl."},"teacher":{"level":"havo, vwo en mbo","groupExample":"havo 5","timers":[20,22,30],"audience":["Voor havo 5 en vwo 6, ook bruikbaar in mbo niveau 3 en 4. Voor maatschappijleer, burgerschap of het mentoruur. Het gaat over hoe stemmen praktisch werkt.","Gecontroleerd op 8 november 2026, voor de verkiezingen van woensdag 17 maart 2027. Geef de les vóór die dag. Kijk vóór gebruik op kiesraad.nl of de data nog kloppen.","De les zegt niet op wie je stemt en ook niet of je gaat stemmen. Ze laat zien hoe stemmen werkt."],"goal":"1. De leerling weet wie mag stemmen voor de Provinciale Staten en het waterschap, en dat je leeftijd op de dag van de stemming telt. 2. De leerling weet wanneer de stempas komt, welk identiteitsbewijs geldt en wat je doet als je stempas kwijt is. 3. De leerling kan uitleggen hoe stemmen bij volmacht en met een kiezerspas werkt, met de regels en deadlines. 4. De leerling kan een stembiljet geldig invullen, weet in neutrale woorden waarover de Provinciale Staten en het waterschap gaan en weet dat een stemhulp alleen een suggestie geeft.","plan":[{"from":0,"to":4,"title":"Uitleg en inloggen","text":"Zet de link en de klascode al op het bord voordat de les begint. Zeg: de mensen en de documenten zijn verzonnen. De regels en de data zijn echt. De les zegt niet op wie je stemt. Leerlingen werken met z'n tweeën op één scherm. Deel de papiertjes \"Mijn stemcheck\" uit als je ze gebruikt."},{"from":4,"to":6,"title":"Startcheck","text":"Elk tweetal beantwoordt vier vragen (vorm A of B) voordat de klok start. Geef geen hints."},{"from":6,"to":32,"title":"Escape","text":"Start de klastimer. Tweetallen spelen vier kamers en schrijven elk cijfer op. Kamer 3 duurt het langst. Klaar voor de tijd? Geef de extra vraag van de kamer. Loopt een tweetal achter? Wijs naar de regel, niet naar het antwoord."},{"at":32,"title":"Stop","text":"Op minuut 32 stopt iedereen, ook wie nog niet klaar is. Lees de cijfers voor van je geprinte antwoordblad. Noem voor iedereen waar neutrale uitleg staat: de gemeente, kiesraad.nl en prodemos.nl. Alle tweetallen doen daarna de eindcheck."},{"from":32,"to":35,"title":"Stop en eindcheck","text":"De andere vorm: vier vragen over dezelfde regels. Daarna ziet elk tweetal wat het goed had, voor en na."},{"from":35,"to":39,"title":"Nabespreken","text":"Vraag per tweetal of ze bij de eindcheck meer goed hadden. Vraag niet naar de score. Vraag welke kamer het lastigst was en begin daar. Vraag niet wie mag of gaat stemmen."},{"from":39,"to":44,"title":"Mijn stemcheck","text":"Iedereen kiest zijn eigen plan of vult het papiertje in. Niemand hoeft iets voor te lezen. Stel daarna de slotvraag."},{"from":44,"to":45,"title":"Reserve","text":"Voor inloggen dat uitloopt. De escape stopt altijd op minuut 32."}],"materials":["een apparaat per tweetal (laptop, Chromebook of telefoon)","pen en papier voor de cijfers","een digibord of beamer","1 papiertje \"Mijn stemcheck\" per leerling (vooraf geprint, als je het gebruikt)"],"tip":"Na twee foute antwoorden laat de les het goede antwoord zien. Een tweetal kan dus doorklikken zonder te lezen. Dat telt niet mee bij \"In één keer goed\". Zeg: goed lezen gaat sneller.","care":["Blijf neutraal. Geef geen stemadvies en zeg niet op wie je zelf stemt. Noem geen partijen of kandidaten, ook niet als voorbeeld.","De les moedigt stemmen niet aan en raadt het ook niet af. Stemmen is niet verplicht. Zeg het ook zo.","Niet elke leerling mag stemmen: sommigen zijn nog geen 18 of geen Nederlander. Vraag niet wie mag stemmen of wie gaat stemmen.","Gebruikt jouw gemeente het nieuwe stembiljet? Zeg dan: hier kleur je twee vakjes, een partij en een kandidaat. De les gaat over het gewone biljet.","Kamer 1 en 2 vragen om dagen tellen. Leerlingen mogen de kalender op hun telefoon gebruiken.","De les is gemaakt voor de verkiezingen van 17 maart 2027. Gebruik hem na 31 maart 2027 niet zonder nieuwe controle.","Noemt een leerling een partij of een mening? Zeg: dank je, daar gaat deze les niet over. Wat zegt de regel? Ga niet in discussie en geef geen oordeel.","Vraagt iemand welke stemhulp je aanraadt? Zeg: er zijn er meer dan één, en de uitkomst is een suggestie. Noem er geen als beste."],"faq":[{"q":"Mag ik als docent een stemadvies geven?","a":"Nee. Blijf neutraal. Geef geen stemadvies en zeg niet op wie je stemt, ook niet als leerlingen erom vragen. Wijs op neutrale uitleg van de gemeente, de Kiesraad en ProDemos."},{"q":"Een leerling vraagt: op wie stemt u?","a":"Zeg: dat hou ik voor mezelf. Stemmen is geheim, ook voor mij. Wil je weten hoe stemmen werkt? Kijk bij je gemeente of de Kiesraad."},{"q":"Een leerling is nog geen 18 of geen Nederlander. Wat nu?","a":"De les werkt voor iedereen. De regels over leeftijd en ID gelden ook bij latere verkiezingen; de data en het biljet gelden alleen voor 17 maart 2027. Wie geen Nederlander is, mag soms wel voor het waterschap stemmen en krijgt dan vanzelf een stempas daarvoor. Vraag niet naar iemands nationaliteit."},{"q":"Wat is het nieuwe stembiljet?","a":"Op 2 november 2026 schreef de Rijksoverheid dat 11 gemeenten zijn uitgenodigd om op 17 maart 2027 een nieuw, kleiner stembiljet te gebruiken. Daar kleur je een partij en een kandidaatnummer, en mag je twee keer een nieuw biljet vragen. Kijk op de site van je gemeente of dat bij jou zo is."},{"q":"Mag je in het stemhokje een foto maken?","a":"Een foto van je eigen stembiljet mag. Fotografeer geen andere kiezers. Niemand mag je dwingen te laten zien wat je stemt."},{"q":"Mag iemand helpen in het stemhokje?","a":"Bij de verkiezingen van 17 maart 2027 blijven de bestaande regels gelden. Hulp in het stemhokje mag dan alleen bij een lichamelijke beperking. De minister streeft naar nieuwe regels vanaf 1 juli 2027, als de Eerste Kamer instemt."},{"q":"Mijn ID is gestolen of kwijt. Kan ik stemmen?","a":"Ja, met een verklaring van vermissing van de gemeente en een pasje met je foto, zoals een ov-chipkaart met foto."},{"q":"Moet mijn werkgever me laten stemmen?","a":"Ja, als stemmen niet buiten je werktijd kan. Je mag dan tot 2 uur weg om te stemmen."},{"q":"Kan Lina haar volmacht nog intrekken?","a":"Bij een volmacht op de stempas wel: ze vraagt haar stempas terug voordat Ans stemt. Een volmacht met een formulier kan niet meer worden ingetrokken."},{"q":"Wat is het verschil tussen blanco en ongeldig?","a":"Blanco: je laat het biljet leeg en kiest niemand. Ongeldig: het biljet is fout ingevuld. Blanco en ongeldige stemmen tellen mee voor de opkomst, niet voor de zetels."},{"q":"Wat zijn goede antwoorden bij het nabespreken?","a":"Vraag 1: elk antwoord met een reden is goed. Vraag 2: zo kan niemand zien of bepalen wat je stemt. Vraag 3: de gemeente, kiesraad.nl en prodemos.nl."}],"closing":"Noem één ding dat Lina kan regelen als ze op 17 maart niet zelf kan stemmen.","answers":{"head":["Kamer","Vraag","Goed antwoord"],"rows":[["1","Wie mag stemmen","Alleen Lina"],["1","Welke verkiezing","Alleen voor het waterschap"],["1","Stempassen thuis","Woensdag 3 maart"],["1","**Cijfer**","**2** (2 en 17 maart 2009)"],["2","Verlopen ID","Ja, hij is minder dan 5 jaar verlopen"],["2","Stempas kwijt","Ze gaat tot dinsdag 12.00 uur naar de balie"],["2","Waar stemmen","In elk stembureau in haar gemeente"],["2","**Cijfer**","**3** (2023, 2026 en 2029)"],["3","Volmacht aan Ans","Ja, Ans woont in dezelfde gemeente"],["3","Om een stempas vragen","Nee, alleen Joris mag iemand vragen"],["3","Stemmen in een andere gemeente","Een kiezerspas van zijn gemeente"],["3","**Cijfer**","**3** (eigen stem plus 2 volmachten, één verkiezing)"],["4","Geldig biljet","Eén vakje met een rood kruisje"],["4","Waarover beslist het waterschap","Over de hogere dijk"],["4","Uitkomst stemhulp","Ze kiest zelf: het is een suggestie"],["4","**Cijfer**","**1** (één keer een nieuw biljet bij het gewone stembiljet)"],["","**Code**","**2331**"]],"after":"Start- en eindcheck vorm A: A1 Ja, op 17 maart ben je al 18; A2 Nee, het is te lang geleden verlopen; A3 Ja, dat past nog binnen het maximum; A4 De stem is ongeldig. Vorm B: B1 Nee, op 17 maart ben je nog 17; B2 Ja, hij is niet te lang verlopen; B3 Nee, dan is het maximum bereikt; B4 De stem telt als blanco.","format":"text"}},"sources":{"ksPS":{"name":"Kiesraad, Provinciale Statenverkiezingen","url":"https://www.kiesraad.nl/verkiezingen/provinciale-staten","checked":"2026-11-08","until":"Until 17 Mar 2027"},"ksWs":{"name":"Kiesraad, Waterschapsverkiezingen","url":"https://www.kiesraad.nl/verkiezingen/waterschappen","checked":"2026-11-08","until":"Until 17 Mar 2027"},"ksKal":{"name":"Kiesraad, Verkiezingskalender Provinciale Staten- en waterschapsverkiezingen 2027 (28 mei 2026)","url":"https://www.kiesraad.nl/documenten/2026/05/28/verkiezingskalender-provinciale-staten--en-waterschapsverkiezingen-2027","checked":"202     // Phone and small screens (stem G4 E1): the documents come after the answers and the rules, so a jump button under the question and a way back at the
    // end of the documents. Hidden from 861 px, where the documents sit next to the question (CSS).
    const jump = P.n ? `<div class="esc-jump"><button class="btn ghost small" data-act="to-docs" id="todocs">${t('toDocs', P.n)}</button></div>` : '';
    let b = '';
    if (q.state === 'done') {
      b = `<section class="card esc-fb ${q.right ? 'ok' : 'no'}" id="fb" tabindex="-1" aria-live="polite"><h2>${q.right ? (q.tries === 1 ? t('good') : t('goodNow')) : t('rightAns')}</h2>
        ${q.right ? '' : `<p class="esc-right"><b>${ansHtml(Q, Q.correct)}</b></p>`}<p class="esc-explain">${esc(Q.explain)}</p>${srcLine(Q)}
        <div class="row"><button class="btn esc-go" data-act="next-q">${last ? t('toDigit') : t('nextQ')}</button></div></section>`;
    } else {
      const nudge = q.state === 'retry' ? `<div class="esc-nudge" id="nudge" tabindex="-1" role="alert"><p><b>${t('notGood')}</b> ${esc(Q.retry)}</p>${point ? `<button class="btn small ghost" data-act="show-line" data-id="${esc(point.id)}">${showBtn}</button>` : Q.pointNone ? `<p class="esc-src">${esc(Q.pointNone)}</p>` : ''}</div>` : '';
      const hint = q.hint ? `<p class="esc-hint" id="hint" tabindex="-1"><b>${t('hint')}</b> ${esc(Q.hint)}</p>` : `<div class="row"><button class="btn ghost" data-act="hint">${t('hintBtn')}</button></div>`;
      let ans = '';
      if (Q.type === 'single') ans = `<div class="esc-cards" role="group" aria-label="${t('answers')}">` + Q.options.map(([id, x]) => { const tried = q.tried.includes(id);
        return `<button class="esc-card${tried ? ' tried' : ''}" data-act="pick" data-v="${esc(id)}" ${tried ? 'disabled' : ''}><span class="esc-card-t">${tried ? `<span class="sr">${t('tried')}</span>` : ''}${esc(x)}</span></button>`; }).join('') + '</div>';
      if (Q.type === 'multi') ans = `<div class="esc-cards" role="group" aria-label="${t('answersMulti')}">` + Q.options.map(([id, x]) => `<button class="esc-card tog" data-act="tog" data-v="${esc(id)}" aria-pressed="${q.picked.includes(id)}"><span class="box" aria-hidden="true"></span><span class="esc-card-t">${esc(x)}</span></button>`).join('')
        + `</div>${q.multiErr ? `<p class="err" role="alert">${t('multiErr')}</p>` : ''}<div class="row"><button class="btn esc-go" data-act="multi-ok">${t('check')}</button></div>`;
      if (Q.type === 'number') ans = `<form data-form="num" class="esc-num" novalidate><label for="num" class="h3">${t('yourAnswer')}${Q.unit && Q.unit !== '€' ? t('inUnit', esc(Q.unit)) : ''}</label><div class="esc-numrow">${Q.unit === '€' ? '<span aria-hidden="true">€</span>' : ''}<input id="num" inputmode="decimal" autocomplete="off" value="${esc(q.raw || '')}" ${q.numErr ? 'aria-invalid="true" aria-describedby="numerr"' : ''}><button class="btn esc-go" type="submit">${t('check')}</button></div>${q.numErr ? `<p class="err" id="numerr" role="alert">${t('numErr')}</p>` : ''}</form>`;
      // The nudge goes under the answers (sfmbo G4 E3): a wrong tap never moves the options down, so a second tap on the same spot lands on an option.
      b = ans + nudge + hint;
    }
    return hud() + `<div class="esc-stage esc-qv${docs ? '' : ' nodocs'}"><section class="esc-a"><p class="eyebrow">${t('qOf', run().qi + 1, R.questions.length)}</p>${introP ? `<p class="esc-situ esc-introline">${markIn(R.intro, introP.line, introP.id)}</p>` : ''}${Q.situ ? `<p class="esc-situ">${situP ? markIn(Q.situ, situP.line, situP.id) : esc(Q.situ)}</p>` : ''}<h2 class="esc-prompt" id="qp" tabindex="-1">${esc(Q.prompt)}</h2>${Q.legend ? `<p class="esc-legend">${esc(Q.legend)}</p>` : ''}${jump}</section>
      ${docs ? `<div class="esc-docs" id="qdocs" tabindex="-1">${docs}${P.n ? `<div class="esc-jumpback"><button class="btn ghost small" data-act="to-q" id="toq">${t('toQ')}</button></div>` : ''}</div>` : ''}<div class="esc-b">${b}${P.left}</div></div>`;
  }

  // Reveal (optional room data, default off): `reveal: { lines: [...], src }` in place of `remember`. After the digit the clue screen is one short card at the
  // top: the digit, the heading (lesson `revealTitle` or "Zo kom je bij dit werk"), the lines, the lesson's `revealNote`, the button, then the source line.
  // remText(R) is the text for the end screen ("Dit neem je mee"), the teacher's Kern and the Beroepenblad. Lessons without `reveal` are unchanged.
  const remText = R => R.reveal ? R.reveal.lines.join(' ') : R.remember || '';
  const revealCard = (R, c, last) => `<section class="card esc-fb ok esc-reveal" id="cluefb" tabindex="-1"><h2>${c.right ? t('found') : t('thisDigit')}</h2><p class="esc-cluetext">${t('writeDown')} <b class="t-url">${esc(R.digit)}</b></p>
      <h3 class="esc-reveal-h">${esc(L.revealTitle || t('revealH'))}</h3><ul class="esc-reveal-l">${R.reveal.lines.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${L.revealNote ? `<p class="esc-reveal-n">${esc(L.revealNote)}</p>` : ''}
      <div class="row"><button class="btn esc-go" data-act="next-room">${last ? t('toLock') : t('nextRoom')}</button></div>${R.reveal.src ? `<p class="esc-src"><b>${t('srcLabel')}</b> ${esc(R.reveal.src)}</p>` : ''}</section>`;
  // Circling gate (optional lesson data `clueGate: { text, button }`, default off): before the digit field the pair first sees the text ({n} is the room
  // number) and one button, such as "Klaar, ik heb omcirkeld". The tap only opens the digit field: nothing is logged or kept.
  const gateCard = () => `<section class="card esc-gate" id="cluegate"><p class="esc-cluetext">${esc(String(L.clueGate.text || '').replace(/\{n\}/g, run().ri + 1))}</p><div class="row"><button class="btn esc-go" data-act="clue-gate" id="cluegatebtn">${esc(L.clueGate.button)}</button></div></section>`;
  // Digit-specific nudge (optional room data `clueWrong: { typed: 'text', ... }`): the text for exactly what the pair typed, e.g. '274' or '5'.
  const clueWrongText = (R, v) => v != null && R.clueWrong && Object.prototype.hasOwnProperty.call(R.clueWrong, v) ? R.clueWrong[v] : '';
  function viewClue() {
    const R = room(), c = run().clue, last = run().ri === L.rooms.length - 1;
    if (c.state === 'done' && R.reveal) return hud() + `<div class="esc-stage nodocs esc-revealv"><div class="esc-a">${revealCard(R, c, last)}</div></div>`;
    const b = c.state !== 'done' && L.clueGate && !c.gate ? gateCard() : c.state === 'done' ? `<section class="card esc-fb ok" id="cluefb" tabindex="-1"><h2>${c.right ? t('found') : t('thisDigit')}</h2><p class="esc-cluetext">${t('writeDown')} <b class="t-url">${esc(R.digit)}</b></p>
        ${R.remember ? `<p class="esc-plain"><b>${t('remember')}</b>${esc(R.remember)}</p>` : ''}<div class="row"><button class="btn esc-go" data-act="next-room">${last ? t('toLock') : t('nextRoom')}</button></div></section>`
      : `<form class="card" data-form="clue" novalidate>${c.long ? `<p class="esc-nudge" role="alert" id="cluenudge" tabindex="-1"><span><b>${esc(t('digitOnly', R.digit.length))}</b>${clueWrongText(R, c.raw) ? ' ' + esc(clueWrongText(R, c.raw)) : ''}</span></p>`
          : c.state === 'retry' ? `<p class="esc-nudge" role="alert" id="cluenudge" tabindex="-1"><span><b>${t('notGood')}</b> ${esc(clueWrongText(R, c.wrong) || R.clueRetry || t('clueRetry'))}</span></p>` : ''}
        <label class="h3" for="digit">${R.digit.length > 1 ? t('yourDigits') : t('yourDigit')}</label><div class="esc-numrow"><input id="digit" inputmode="numeric" autocomplete="off" maxlength="12" value="${esc(c.raw || '')}"${c.long ? ' aria-invalid="true" aria-describedby="cluenudge"' : ''}><button class="btn esc-go" type="submit">${t('check')}</button></div></form>`;
    const recap = `<details class="esc-recap" open><summary>${t('recapH')}</summary><dl>${R.questions.map(Q => `<div><dt>${esc(Q.prompt)}</dt><dd>${ansHtml(Q, Q.correct)}</dd></div>`).join('')}</dl></details>`;
    return hud() + `<div class="esc-stage"><section class="esc-a card"><p class="esc-open" tabindex="-1" id="ct">${t('roomDone')}</p><p class="esc-cluetext">${R.clueFull ? '' : t('clueLead', R.digit.length)}${esc(R.clue)}</p>${recap}</section>
      <div class="esc-docs">${docsFor(R, R.clueDocs, null, !R.clueDocs || R.clueDocs.includes('rules'))}</div><div class="esc-b">${b}</div></div>`;
  }

  function viewLock() {
    const r = run(), code = lockCode();
    const kept = r.lockVals || [];
    const inputs = code.split('').map((x, i) => `<label class="esc-digit" for="d${i}">${t('digitN', i + 1)}<input id="d${i}" inputmode="numeric" maxlength="2" autocomplete="off" data-dial="${i}" value="${esc(kept[i] || '')}"></label>`).join('');
    const list = L.rooms.map((R, i) => `<li><span>${esc(t('roomItem', i + 1, R.title))}</span><b>${r.lockTries >= 3 ? esc(R.digit) : t('nDigits', R.digit.length)}</b></li>`).join('');
    return hud() + `<section class="card"><h2 tabindex="-1" id="lt">${esc((L.lock && L.lock.title) || t('lockTitle'))}</h2><p class="esc-cluetext">${esc((L.lock && L.lock.intro) || t('lockIntro'))}</p>
      <form data-form="lock" novalidate><div class="esc-dial" role="group" aria-label="${t('lockGroup')}">${inputs}</div>
      ${r.lockErr ? `<p class="err" role="alert" id="lockerr">${t('lockErr')}</p>` : ''}<div class="row"><button class="btn esc-go big" type="submit">${t('lockOpen')}</button></div></form>
      ${r.lockTries >= 3 ? `<p>${t('lockFound')}</p>` : ''}<ul class="esc-found">${list}</ul></section>`;
  }

  // The pair stops before the lock is open (time is up): type the digits the teacher reads out, or go straight on to the end check and the plan.
  function viewStop() {
    const r = run(), code = lockCode(), pre = []; let pos = 0;
    L.rooms.forEach((R, i) => { for (const ch of R.digit) pre[pos++] = r.digits[i] != null ? ch : ''; });
    const inputs = code.split('').map((x, i) => `<label class="esc-digit" for="d${i}">${t('digitN', i + 1)}<input id="d${i}" inputmode="numeric" maxlength="2" autocomplete="off" data-dial="${i}" value="${esc(r.lockErr && r.lockVals ? r.lockVals[i] || '' : pre[i])}"></label>`).join('');
    return hud() + `<section class="card esc-stopv"><h2 tabindex="-1" id="stoph">${t('pStopH')}</h2><p class="esc-cluetext">${t('pStopLead')}</p>
      <form data-form="lock" novalidate><div class="esc-dial" role="group" aria-label="${t('lockGroup')}">${inputs}</div>
      ${r.lockErr ? `<p class="err" role="alert" id="lockerr">${t('lockErr')}</p>` : ''}<div class="row"><button class="btn esc-go" type="submit">${t('lockOpen')}</button></div></form>
      <p>${t('pStopOr')}</p><div class="row"><button class="btn" data-act="p-skip" id="pskip">${L.check ? t('pStopSkip') : t('pStopSkipNoCheck')}</button><button class="btn ghost" data-act="p-back">${t('pStopBack')}</button></div></section>`;
  }

  // Plan slip "Mijn volgende stap" (optional lesson data `slip`). Pupils fill the paper slip in; the end screen shows its fields as a read-only reminder, or with
  // `slip.screen: true` as plain inputs that exist only in this page's memory: no form, no name, no autocomplete, never logged, never stored, never in the URL.
  const slipLines = f => f.lines == null ? 1 : f.lines;
  const slipLabel = f => esc(f.label) + (f.hint ? ` <small class="slip-hint">${esc(f.hint)}</small>` : '');
  function slipCard(r) {
    const S = L.slip; if (!S) return '';
    const head = `<h2 class="h3">${esc(S.title)}</h2>${S.intro ? `<p>${esc(S.intro)}</p>` : ''}`;
    if (S.screen) {
      const inputs = S.fields.map((f, i) => {
        const v = esc(r.slipDraft[i] || ''), at = `id="slip-in-${i}" data-slip="${i}" maxlength="300" autocomplete="off" autocapitalize="off" spellcheck="false"`;
        return `<label class="field" for="slip-in-${i}">${i + 1}. ${slipLabel(f)}${slipLines(f) > 1 ? `<textarea ${at} rows="${Math.min(slipLines(f), 4)}">${v}</textarea>` : `<input ${at} type="text" value="${v}">`}</label>`;
      }).join('');
      return `<section class="card esc-wide slip-card" id="slipcard"><div class="slip-body">${head}<p class="slip-note"><b>${t('slipScreenNote')}</b> ${t('slipScreenMore')}</p><div class="slip-fields">${inputs}</div>${S.footer ? `<p class="note">${esc(S.footer)}</p>` : ''}</div></section>`;
    }
    return `<section class="card esc-wide slip-card" id="slipcard"><div class="slip-body">${head}<p><b>${S.paper ? esc(S.paper) : t('slipPaper')}</b> ${t('slipPaperMore')}</p><ol class="esc-talk slip-read">${S.fields.map(f => `<li>${slipLabel(f)}${f.choices ? `<small class="slip-hint">${esc(choiceText(f))}</small>` : ''}</li>`).join('')}</ol>${S.footer ? `<p class="note">${esc(S.footer)}</p>` : ''}</div></section>`;
  }
  // Topic wish on the end screen (persona QA m6): the lesson's own list (optional lesson field `wishes`, topic ids from LOG.WISHES) or a default that
  // spans the whole series (study choice, student finance, housing, work, tax, health insurance, money), never only money and insurance. "anders" is always last.
  const WISH_DEFAULT = ['studiekeuze', 'studiefinanciering', 'wonen', 'werk', 'belasting', 'zorgverzekering', 'budget'];
  const wishList = () => { const own = Array.isArray(L.wishes) ? L.wishes.filter(w => LOG.WISHES.includes(w) && w !== 'anders') : [];
    return Array.from(new Set(own.length ? own : WISH_DEFAULT)).concat('anders'); };
  // The lock opened (persona QA m5): a short "Het slot is open!" moment before the end check, never a jump straight into it. It moves on by itself
  // after OPEN_MS, or at once with the button.
  const OPEN_MS = 2000;
  let openTimer = 0;
  function viewOpen() {
    const code = lockCode();
    return `<header class="top">${brand()}</header><section class="esc-win esc-opened" aria-live="polite"><div class="esc-lockbig" aria-hidden="true">${code.split('').map(x => `<i>${esc(x)}</i>`).join('')}</div>
      <h1 class="esc-open-h" id="openh" tabindex="-1">${t('won')}</h1><p class="lead">${t('openLead')}</p><div class="row"><button class="btn esc-go big" data-act="open-next" id="opennext">${t('pStopSkip')}</button></div></section>`;
  }
  function openNext() { clearTimeout(openTimer); openTimer = 0; const r = run(); if (S.view !== 'open' || !r) return; S.view = 'check'; S.phase = 'end'; r.chkDraft = {}; render(); }
  function viewWin() {
    const r = run(), code = lockCode(), A = r.chk.start, Z = r.chk.end;
    const rows = res => res ? formQs(res.form).map(Q => `<tr><th scope="row">${esc(Q.prompt)}</th><td data-h="${esc(t('colRight'))}">${esc(chkAns(Q))}</td><td data-h="${esc(t('colResult'))}">${res.ans[Q.id] === Q.correct ? t('ok') : t('wrong')}</td></tr>`).join('') : '';
    const chk = L.check && A && Z ? `<section class="card esc-wide"><h2 class="h3">${t('chkTitle')}</h2><p>${t('beforeAfter', A.score, A.max, Z.score, Z.max)}</p>
      <table class="esc-chk-t"><thead><tr><th scope="col">${t('colQ')}</th><th scope="col">${t('colRight')}</th><th scope="col">${t('colResult')}</th></tr></thead><tbody>
      <tr><th colspan="3" scope="colgroup">${t('colBefore')}</th></tr>${rows(A)}<tr><th colspan="3" scope="colgroup">${t('colAfter')}</th></tr>${rows(Z)}</tbody></table></section>` : '';
    const take = `<section class="card esc-take esc-wide"><h2 class="h3">${t('takeTitle')}</h2><ul>${L.rooms.filter(R => remText(R)).map(R => `<li>${esc(remText(R))}</li>`).join('')}</ul></section>`;
    const talk = L.debrief && L.debrief.length ? `<section class="card esc-wide"><h2 class="h3">${t('talkTitle')}</h2><ul class="esc-talk">${L.debrief.map(p => `<li>${esc(p)}</li>`).join('')}</ul></section>` : '';
    const P = L.plan;
    let plan = '';
    if (P) {
      const out = r.plan ? `<div class="plan-out"><p class="plan-card" id="plancard" tabindex="-1">${esc(t('planCard', r.plan.when, r.plan.then) + (r.plan.within ? ' ' + t('withinCard', r.plan.within) : ''))}</p><p class="note">${t('planNote')}</p><div class="row"><button class="btn ghost" data-act="print-plan">${t('printPlan')}</button><button class="btn ghost" data-act="plan-again">${t('planAgain')}</button></div></div>`
        : `<form data-form="plan" class="esc-b" novalidate><fieldset><legend>${t('when')}</legend><div class="opts">${P.when.map((x, i) => `<label class="opt"><input type="radio" name="when" value="${i}"><span>${esc(x)}</span></label>`).join('')}</div></fieldset>
          <fieldset><legend>${t('then')}</legend><div class="opts">${P.then.map((x, i) => `<label class="opt"><input type="radio" name="then" value="${i}"><span>${esc(x)}</span></label>`).join('')}</div></fieldset>
          ${P.within ? `<fieldset><legend>${t('within')} ...</legend><div class="opts">${P.within.map((x, i) => `<label class="opt"><input type="radio" name="within" value="${i}"><span>${esc(x)}</span></label>`).join('')}</div></fieldset>` : ''}
          <label class="field" for="own">${t('own')} <small>${t('ownHelp')}</small><input id="own" name="own" maxlength="160" autocomplete="off"></label>
          ${r.planErr ? `<p class="err" role="alert">${esc(t('planErr'))}</p>` : ''}<div class="row"><button class="btn esc-go" type="submit">${t('makePlan')}</button></div></form>`;
      plan = `<section class="card esc-wide print-me"><h2 class="h3">${t('planTitle')}</h2><p>${esc(P.intro || t('planIntro'))}</p>${out}</section>`;
    }
    let fb = '';
    if (logActive()) {
      const row = (k, lab, lo, hi) => `<fieldset><legend>${lab}</legend><div class="taps" role="group">${[1, 2, 3, 4, 5].map(v => `<button class="tap" data-act="tap" data-k="${k}" data-v="${v}" aria-pressed="${r.fb[k] === v}" aria-label="${t('ofFive', v)}${v === 1 ? ', ' + lo : v === 5 ? ', ' + hi : ''}">${v}</button>`).join('')}</div><small class="note">1 = ${lo}, 5 = ${hi}</small></fieldset>`;
      const wish = `<fieldset class="wish"><legend>${t('wishQ')} <small>${t('wishOpt')}</small></legend><div class="wish-opts" role="group">${wishList().map(w => `<button class="tap wish-tap" data-act="wish" data-v="${w}" aria-pressed="${r.fb.wish === w}">${esc(t('wishes')[w])}</button>`).join('')}</div></fieldset>`;
      fb = r.fb.sent ? `<section class="card esc-wide" id="pfb" tabindex="-1"><p>${t('pfbThanks')}</p></section>`
        : `<section class="card esc-wide"><h2 class="h3">${t('pfbTitle')}</h2>${row('fun', t('fun'), t('funLo'), t('funHi'))}${row('learned', t('learned'), t('learnedLo'), t('learnedHi'))}${wish}
          <div class="row"><button class="btn" data-act="send-pfb" ${r.fb.fun && r.fb.learned ? '' : 'disabled'}>${t('send')}</button></div><p class="note">${t('pfbNote')}</p></section>`;
    }
    const skipped = r.stopped === 'skip';
    return `<header class="top">${brand()}</header><section class="esc-win">${skipped ? '' : `<div class="esc-lockbig" aria-hidden="true">${code.split('').map(x => `<i>${esc(x)}</i>`).join('')}</div>`}
      <h1 class="esc-won" tabindex="-1">${skipped ? t('wonStop') : t('won')}</h1>${skipped ? `<p class="lead" id="stopnote">${t('wonStopNote')}</p>` : ''}
      <dl class="esc-stats"><div><dt>${t('statHints')}</dt><dd>${r.hints}</dd></div><div><dt>${t('statFirst')} <small class="esc-stat-n">(${t('statFirstNote')})</small></dt><dd id="statfirst">${r.stopped ? t('statFirstOf', r.first, r.done) : r.first + '/' + nQ()}</dd></div></dl>
      ${chk}${talk}${take}${plan}${slipCard(r)}${fb}<div class="row"><button class="btn ghost" data-act="restart">${t('restart')}</button></div></section>`;
  }

  // ----- teacher view -----
  const baseLink = () => location.href.split(/[?#]/)[0];
  const pupilLink = () => baseLink() + '?klas=' + encodeURIComponent(T.code) + (T.share === false || !LOG.on() ? '&log=0' : '') + (T.dur !== (RAW.minutes || 30) ? '&tijd=' + T.dur : '') + (lang === 'nl' ? '' : '&lang=' + lang);
  const shortOf = u => u.replace(/^https?:\/\//, '').replace(/index\.html$/, '');
  function joinBlock() {
    const link = pupilLink(), web = /^https?:\/\//.test(link), M = web && QR ? QR.qr(link) : null, n = M ? M.length + 8 : 0;
    const svg = M ? `<div class="t-qr"><svg viewBox="0 0 ${n} ${n}" role="img" aria-label="${t('qrLabel')}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${QR.qrPath(M)}" fill="#000"/></svg></div>` : '';
    return `<p class="t-code">${t('classCode')} <b id="tcode">${esc(T.code)}</b></p>
      <div class="t-join"><p>${t('joinType')}</p><p class="big" id="tshort">${esc(shortOf(baseLink()))}</p><p>${t('joinCode')}</p></div>
      <div class="t-link">${svg}<div><p>${web ? t('qrExtra') : ''}</p><p class="t-url" id="tlink"><span class="sr">${t('link')}</span>${esc(shortOf(link))}</p>${web ? '' : `<p class="note">${t('fileNote')}</p>`}</div></div>
`;
  }
  function choiceBlock() {
    if (!LOG.on()) return `<p class="note" id="tshare">${t('shareNoConfig')} <a href="${privacyHref()}">${t('privacy')}</a></p>`;
    const locked = !!T.code;
    return `<div class="t-choice" id="tshare" role="group" aria-labelledby="shareq"><p class="q" id="shareq">${t('shareQ')}</p>
      <div class="row"><button class="btn ghost" data-act="t-share" data-v="ja" aria-pressed="${T.share === true}" ${locked ? 'disabled' : ''}>${t('fbJa')}</button><button class="btn ghost" data-act="t-share" data-v="nee" aria-pressed="${T.share === false}" ${locked ? 'disabled' : ''}>${t('fbNee')}</button></div>

  function roomSrcKeys(R) {

  // ----- teacher actions -----
  function teacherStart() {
    T.code = LOG.newClassCode(); T.session = LOG.newSession(); ss.set('code', T.code); ss.set('session', T.session);
    resReset();
    tlog('teacher_start', { variant: L.variant || 'basis', rooms: L.rooms.length, lang }); devReuse(); LOG.flush();
    render('#tcode', true);
  }
  function sendFeedback(form) {
    const f = new FormData(form), again = f.get('again'), used = f.get('used');
    const num = k => { const s = String(f.get(k) || '').trim(); return /^\d{1,3}$/.test(s) ? parseInt(s, 10) : null; };
    const pupils = num('pupils'), minutes = num('minutes');
    if (!again || !used || pupils == null || minutes == null) { T.fbErr = t('fbErr'); render('#fberr', true); return; }
    const ok = tlog('feedback', { again, used, pupils, minutes, worked: String(f.get('worked') || '').slice(0, 500), notworked: String(f.get('notworked') || '').slice(0, 500) });
    LOG.flush();
    T.fbErr = ''; if (ok) { T.draft = {}; T.fb = 'sent'; } render(ok ? '#tfb' : null, true);
  }
  function tick() {
    if ((S.view === 'teacher' || S.view === 'proj') && T.running) {
      T.left = Math.max(0, Math.round((T.endAt - now()) / 1000));
      const c = document.getElementById('tclock'); if (c) c.textContent = mmss(T.left);
      if (S.view === 'proj') projNow();
      if (T.left <= 0) { T.running = false; const card = c && c.closest('.t-timer'); if (card) { card.classList.add('over'); if (!document.getElementById('tover') && !T.stopped) c.insertAdjacentHTML('afterend', overNote()); }
        const b = document.getElementById('trun'); if (b) { b.textContent = t('startTimer'); b.hidden = true; } }
    }
    if (S.view === 'teacher' && T.qs.run) { const q = document.getElementById('qstime'); if (q) q.textContent = mmss(qsMs() / 1000); }
    if (S.run && S.run.t0 && ESCAPE_VIEWS.includes(S.view)) {
      // Calm notice once the escape time is over (real time since the first room); no re-render, so typed input and focus stay.
      if (!S.run.timeUp && elapsed() >= LIMIT_MIN * 60) { S.run.timeUp = true; const h = app.querySelector('.esc-hud'); if (h && !document.getElementById('timeup')) h.insertAdjacentHTML('afterend', timeUpHtml()); }
    }
  }
  setInterval(tick, 250);

  // One print dialog per click (mbo G4 N10): a second click that waited behind the open dialog, or a double click, does not print again.
  // Per print button: another print button right after still prints.
  let printAt = 0, printLast = '', printing = false;
  function printOnce(cls) {
    if (printing || (cls === printLast && now() - printAt < 1500)) return;
    printing = true; document.body.classList.add(cls);
    try { window.print(); } finally { printing = false; printAt = now(); printLast = cls; }
  }
  // ----- events -----
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.dataset.act === 'qs-do' ? b.dataset.v : b.dataset.act, r = run(); // the prep card's print buttons do what the plan card's buttons do
    if (act === 'teacher') { S.view = 'teacher'; render(); }
    else if (act === 'pupil') { S.view = 'start'; S.run = null; render(); }
    else if (act === 'lang') { setLang(b.dataset.v); render(`[data-act="lang"][data-v="${lang}"]`, true); }
    else if (act === 'go-q') showQ(0);
    else if (act === 'pick') answer(b.dataset.v);
    else if (act === 'tog') { const q = r.q, v = b.dataset.v; q.picked = q.picked.includes(v) ? q.picked.filter(x => x !== v) : q.picked.concat(v); q.multiErr = false; b.setAttribute('aria-pressed', q.picked.includes(v)); saveRun(); }
    else if (act === 'resume') { if (S.resume) restoreRun(S.resume); }
    else if (act === 'resume-no') { clearRun(); render(); }
    else if (act === 'open-next') openNext();
    else if (act === 't-key-ok') { const d = b.closest('details'), body = d && d.querySelector('.t-keybody'); T.keyOk = true;
      app.querySelectorAll('.t-gate').forEach(g => g.remove()); app.querySelectorAll('.t-keybody').forEach(x => { x.hidden = false; }); if (body) body.focus({ preventScroll: true }); }
    else if (act === 'multi-ok') { const q = r.q; if (!q.picked.length) { q.multiErr = true; render('[data-act="multi-ok"]', true); return; } answer(q.picked.slice().sort()); }
    else if (act === 'hint') { const q = r.q; if (!q.hint) { q.hint = true; r.pen += HINT_S; r.hints++; } render('#hint', true); }
    else if (act === 'show-line') { const el = document.getElementById(b.dataset.id); if (el) { showSpot(el); } }
    else if (act === 'to-docs') { const d = document.getElementById('qdocs'); if (d) { d.scrollIntoView({ block: 'start' }); d.focus({ preventScroll: true }); } }
    else if (act === 'to-q') { const a = app.querySelector('.esc-qv .esc-a'), h = document.getElementById('qp'); if (a) a.scrollIntoView({ block: 'start' }); if (h) h.focus({ preventScroll: true }); }
    else if (act === 'next-q') nextQ();
    else if (act === 'next-room') nextRoom();
    else if (act === 'clue-gate') { if (r && r.clue) { r.clue.gate = true; render('#digit', true); } }
    else if (act === 'tap') { r.fb[b.dataset.k] = parseInt(b.dataset.v, 10); render(`[data-act="tap"][data-k="${b.dataset.k}"][data-v="${b.dataset.v}"]`, true); }
    else if (act === 'wish') { r.fb.wish = r.fb.wish === b.dataset.v ? '' : b.dataset.v; render(`[data-act="wish"][data-v="${b.dataset.v}"]`, true); }
    else if (act === 'send-pfb') { if (r.fb.fun && r.fb.learned && !r.fb.sent) { plog('pupil_feedback', Object.assign({ fun: r.fb.fun, learned: r.fb.learned }, r.fb.wish ? { wish: r.fb.wish } : {})); LOG.flush(); r.fb.sent = true; render('#pfb', true); } }
    else if (act === 'plan-again') { r.plan = null; render('[name="when"]', true); }
    else if (act === 'we-stop' && b.dataset.bar && stopEarly()) { if (ESCAPE_VIEWS.includes(S.view)) { r.stopAsk = true; render('#westopyes', true); } }
    else if (act === 'we-stop' || act === 'we-stop-yes') { if (ESCAPE_VIEWS.includes(S.view)) { r.stopAsk = false; r.prevView = S.view; r.lockErr = false; r.lockVals = null; S.view = 'stop'; render('#stoph'); } }
    else if (act === 'we-stop-no') { r.stopAsk = false; render('#westop', true); }
    else if (act === 'p-skip') stopExit('skip');
    else if (act === 'p-back') { S.view = r.prevView || 'intro'; r.lockErr = false; r.lockVals = null; render(FOCUS[S.view]); }
    else if (act === 't-stop') { T.stopped = !T.stopped; if (T.stopped && T.running) { T.left = Math.max(0, Math.round((T.endAt - now()) / 1000)); T.running = false; }
      if (T.stopped) { RES.stoppedAt = now(); RES.done = false; } render(T.stopped ? '#tstoph' : '#tstop', true); }
    else if (act === 'res-refresh') { if (resWanted()) { LOG.flush(); resFetch(true); resUpdate(); } }
    else if (act === 'dev-forget') { try { localStorage.removeItem(DEV_KEY); } catch (e) { /* nothing stored */ } T.devGone = true; const d = document.getElementById('tdev'); if (d) d.remove(); const h = app.querySelector('#tfb') || app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
    else if (act === 'proj') { S.view = 'proj'; if (T.code) qsTick('board'); render(); }
    else if (act === 'proj-back') { S.view = 'teacher'; T.pProb = false; render('#tproj'); }
    else if (act === 'p-prob') { T.pProb = !T.pProb; render('[data-act="p-prob"]', true); }
    else if (act === 'goto-prob') { const h = document.getElementById('tprob-h'); if (h) { h.scrollIntoView({ block: 'start' }); h.focus({ preventScroll: true }); } }
    else if (act === 'qs-start') { Object.assign(T.qs, { on: true, run: true, t0: now(), acc: 0, fin: false }); if (t('qsSteps').every(x => T.qs.done.has(x[0]))) Object.assign(T.qs, { run: false, fin: true }); render(T.qs.fin ? '#qs-h' : '[data-act="qs-pause"]', true); }
    else if (act === 'qs-pause') { const Q = T.qs; if (Q.run) { Q.acc = qsMs(); Q.run = false; } else { Q.run = true; Q.t0 = now(); } render('[data-act="qs-pause"]', true); }
    else if (act === 'qs-reset') { T.qs = { on: false, run: false, fin: false, t0: 0, acc: 0, done: new Set() }; render('[data-act="qs-start"]', true); }
    else if (act === 'restart') { clearRun(); S.run = null; S.view = 'start'; render(); }
    else if (act === 't-share') { T.share = b.dataset.v === 'ja'; ss.set('share', b.dataset.v); render(`[data-act="t-share"][data-v="${b.dataset.v}"]`, true); }
    else if (act === 't-start') teacherStart();
    else if (act === 't-new') { resReset(); T.code = ''; T.share = null; T.session = ''; T.fb = ''; T.draft = {}; ss.set('code', null); ss.set('share', null); ss.set('session', null); render('#shareq', true); }
    else if (act === 't-dur') { T.dur = parseInt(b.dataset.v, 10); T.running = false; T.left = T.dur * 60; render(`[data-act="t-dur"][data-v="${T.dur}"]`, true); }
    else if (act === 't-run') { if (T.running) T.running = false; else { if (T.left <= 0) T.left = T.dur * 60; T.running = true; T.endAt = now() + T.left * 1000; } render('#trun', true); }
    else if (act === 't-reset') { T.running = false; T.left = T.dur * 60; render('[data-act="t-reset"]', true); }
    else if (act === 'print' || act === 'print-paper' || act === 'print-paper-key' || act === 'print-plan' || act === 'print-slips' || act === 'print-verslag' || (act === 'print-bblad' && BB())) {
      if (act === 'print') qsTick('print'); if (act === 'print-paper' || act === 'print-paper-key' || act === 'print-bblad') qsTick('paper');
      if (S.view === 'teacher' && (act === 'print' || act === 'print-paper' || act === 'print-paper-key' || act === 'print-bblad')) render(b.dataset.act === 'qs-do' ? `[data-act="qs-do"][data-v="${act}"]` : `[data-act="${act}"]`, true);
      printOnce(act === 'print' ? 'print-sheet' : act); }
  });
  // Feedback confirmation wording depends on connectivity; the log queue itself flushes on 'online' (log.js).
  const fbRefresh = () => { if (S.view === 'teacher' && T.fb === 'sent' && document.getElementById('tfb')) render(null, true); };
  window.addEventListener('online', fbRefresh); window.addEventListener('offline', fbRefresh);
  window.addEventListener('afterprint', () => document.body.classList.remove('print-sheet', 'print-paper', 'print-paper-key', 'print-plan', 'print-slips', 'print-verslag', 'print-bblad'));
  document.addEventListener('visibilitychange', () => resSync());
  window.addEventListener('online', () => resSync()); window.addEventListener('offline', () => resSync());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.view === 'proj') { S.view = 'teacher'; T.pProb = false; render('#tproj'); } });
  // The "Test de link" step ticks when the teacher opens the pupil screen from the card (a new tab, with log=0 so the test sends nothing).
  app.addEventListener('click', e => { const a = e.target.closest('a[data-qs-link]'); if (!a) return; qsTick('link'); // no re-render: the link must stay in the page while it opens
    const c = document.getElementById('qs-link'); if (c) { c.checked = true; c.closest('li').classList.add('done'); }
    const st = document.getElementById('qsstatus'); if (st) { const n = t('qsSteps').filter(x => T.qs.done.has(x[0])).length; st.textContent = T.qs.fin ? t('qsFin', qsMin()) : t('qsStatus', n, t('qsSteps').length); } });
  app.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.pb) { if (d.open) T.pbOpen.add(d.dataset.pb); else T.pbOpen.delete(d.dataset.pb); } }, true);
  app.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const k = f.dataset.form, r = run();
    if (k === 'start') {
      const el = f.querySelector('#klas');
      if (el) { const v = el.value.trim().toUpperCase(); S.klasTyped = v; if (v && !LOG.validCode(v)) { S.klasErr = true; render('#klas', true); return; } S.klasErr = false; S.klas = v; }
      startRun();
    } else if (k === 'check') checkDone(f);
    else if (k === 'num') { const raw = f.querySelector('#num').value, n = parseNum(raw); r.q.raw = raw; if (n == null) { r.q.numErr = true; render('#num', true); return; } r.q.numErr = false; answer(n); }
    else if (k === 'clue') clueTry(f.querySelector('#digit').value);
    else if (k === 'lock') { const vals = Array.from(f.querySelectorAll('[data-dial]')).map(i => i.value.trim()); r.lockVals = vals; lockTry(vals.join('')); } // the typed digits stay after a wrong code
    else if (k === 'plan') {
      const w = f.querySelector('input[name="when"]:checked'), th = f.querySelector('input[name="then"]:checked'), own = f.querySelector('#own').value.trim();
      const wi = f.querySelector('input[name="within"]:checked');
      if (!w || (!th && !own) || (L.plan.within && !wi)) { r.planErr = true; render('.err', true); return; }
      r.planErr = false; r.plan = { when: L.plan.when[+w.value], then: own || L.plan.then[+th.value], within: L.plan.within ? L.plan.within[+wi.value] : '' }; render('#plancard', true);
    } else if (k === 'fb') sendFeedback(f);
  });
  app.addEventListener('input', e => {
    const x = e.target;
    // Lock boxes (rekening G4 E4): a new digit replaces the one in the box, wherever the caret is (the typed digit is e.data; maxlength 2 lets it in).
    if (x.dataset && x.dataset.dial != null) { const typed = String(e.data || '').replace(/\D/g, '').slice(-1); x.value = typed || x.value.replace(/\D/g, '').slice(-1);
      if (x.value) { const nx = document.getElementById('d' + (+x.dataset.dial + 1)); if (nx) nx.focus(); } }
    if (x.closest && x.closest('form[data-form="fb"]') && x.name) T.draft[x.name] = x.value;
    if (x.dataset && x.dataset.slip != null && S.run) S.run.slipDraft[x.dataset.slip] = x.value; // memory only, see slipCard
    if (x.dataset && x.dataset.vs != null) { T.vs[x.dataset.vs] = x.value; const o = document.getElementById('vsout'); if (o) o.innerHTML = vsOut(); } // memory only, see vsBlock
  });
  app.addEventListener('change', e => { const x = e.target; if (x.closest && x.closest('form[data-form="fb"]') && x.name) T.draft[x.name] = x.value;
    if (x.dataset && x.dataset.qs) { qsTick(x.dataset.qs, x.checked); render('#qs-' + x.dataset.qs, true); } });
  // A lock box selects its digit on focus, so a tap and a key replace it (also on keyboards that send no e.data).
  app.addEventListener('focusin', e => { const x = e.target; if (x.dataset && x.dataset.dial != null && x.value) { try { x.select(); } catch (er) { /* not selectable */ } } });
  app.addEventListener('keydown', e => {
    const x = e.target;
    if (x.dataset && x.dataset.dial != null && e.key === 'Backspace' && !x.value) { const pv = document.getElementById('d' + (+x.dataset.dial - 1)); if (pv) { e.preventDefault(); pv.focus(); pv.value = ''; } }
  });

  document.documentElement.lang = lang;
  S.resume = loadRun();
  if (location.hash === '#docent') S.view = 'teacher';
  if (location.hash === '#bord') S.view = 'proj';
  render();
})();
</script>
</body>
